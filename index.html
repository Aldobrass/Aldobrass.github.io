<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Albert Cornelius | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 900px;
            padding: 40px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: #cbd5f5;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 15px;
            border-bottom: 2px solid #38bdf8;
            display: inline-block;
            padding-bottom: 5px;
        }

        ul {
            list-style: none;
            margin-top: 15px;
        }

        li {
            background: #020617;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 10px;
            transition: 0.3s;
        }

        li:hover {
            transform: translateY(-3px);
            background: #020617dd;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Halo, saya Albert Cornelius</h1>
    <p>Web Developer | Laravel | React</p>

    <h2>Project</h2>
    <ul>
        <li>Website produksi - Laravel</li>
        <li>Website E-Commerce</li>
        <li>Aplikasi Booking</li>
    </ul>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albert Cornelius | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #020617;
            color: #e5e7eb;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* BACKGROUND HALUS */
        .bg-animated {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(56,189,248,0.08), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(99,102,241,0.08), transparent 40%);
            animation: bgMove 15s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes bgMove {
            from { transform: translateY(0); }
            to { transform: translateY(-40px); }
        }

        /* LAYOUT */
        .wrapper {
            max-width: 1100px;
            margin: auto;
            padding: 80px 40px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 60px;
            align-items: center;
        }

        /* FOTO */
        .profile img {
            width: 100%;
            border-radius: 20px;
            border: 3px solid #38bdf8;
            animation: fadeSlide 6s ease-in-out infinite;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateX(-40px);
            }
            20% {
                opacity: 1;
                transform: translateX(0);
            }
            80% {
                opacity: 1;
                transform: translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-40px);
            }
        }

        /* CONTENT */
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: #cbd5f5;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 15px;
            border-bottom: 2px solid #38bdf8;
            display: inline-block;
            padding-bottom: 5px;
        }

        ul {
            list-style: none;
            margin-top: 15px;
        }

        li {
            background: rgba(2, 6, 23, 0.85);
            border: 1px solid #1e293b;
            padding: 18px 20px;
            margin-bottom: 14px;
            border-radius: 14px;
            transition: 0.3s;
        }

        li:hover {
            transform: translateY(-3px);
        }

        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        /* =========================
           RESPONSIVE MOBILE (ANIMATED)
           ========================= */
        @media (max-width: 768px) {
        
            .wrapper {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 60px 20px;
                text-align: center;
            }
        
            /* FOTO DI HP — MASIH ANIMASI, TAPI HALUS */
            .profile img {
                max-width: 220px;
                margin: 0 auto;
                animation: fadeSlideMobile 8s ease-in-out infinite;
            }
        
            @keyframes fadeSlideMobile {
                0% {
                    opacity: 0;
                    transform: translateY(20px);
                }
                20% {
                    opacity: 1;
                    transform: translateY(0);
                }
                80% {
                    opacity: 1;
                    transform: translateY(0);
                }
                100% {
                    opacity: 0;
                    transform: translateY(20px);
                }
            }
        
            /* BACKGROUND ANIMASI — LEBIH PELAN */
            .bg-animated {
                animation-duration: 25s;
                opacity: 0.7;
            }
        
            h1 {
                font-size: 2.2rem;
            }
        
            p {
                font-size: 1rem;
            }
        
            ul {
                margin-top: 25px;
            }
        
            li {
                text-align: left;
            }
        }

    </style>
</head>
<body>

<div class="bg-animated"></div>

<div class="wrapper">
    <!-- FOTO KIRI -->
    <div class="profile">
        <img src="foto.jpg" alt="Foto Albert">
    </div>

    <!-- KONTEN KANAN -->
    <div class="content">
        <h1>Halo, saya Albert Cornelius</h1>
        <p>Web Developer | Laravel | React</p>

        <h2>Project</h2>
        <ul>
            <li>
                Website Produksi (Laravel)<br>
                <a href="https://github.com/aldobrass/ProjekProduksi" target="_blank">
                    Lihat Kode di GitHub
                </a>
            </li>
            <li>Website E-Commerce</li>
            <li>Aplikasi Booking</li>
        </ul>
    </div>
</div>

</body>
</html>
